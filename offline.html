<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Anshu Arunav</title>
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b0a09'/%3E%3Ctext x='32' y='43' font-family='-apple-system,Segoe UI,Inter,sans-serif' font-size='30' font-weight='600' letter-spacing='-1.5' fill='%23f7f4ef' text-anchor='middle'%3EAA%3C/text%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("assets/fonts/inter-latin.woff2") format("woff2");
  }
  :root { color-scheme: dark light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: #0b0a09;
    color: #f7f4ef;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .glow {
    position: fixed;
    inset: -20% auto auto -10%;
    width: 60vw; height: 60vw;
    border-radius: 50%;
    background: radial-gradient(circle, #ffb35c 0%, transparent 68%);
    opacity: 0.16;
    filter: blur(90px);
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 46ch; }
  .mark {
    display: grid; place-items: center;
    width: 46px; height: 46px;
    margin: 0 auto 28px;
    border-radius: 14px;
    background: #f7f4ef; color: #0b0a09;
    font-size: 17px; font-weight: 700; letter-spacing: -0.04em;
  }
  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; }
  p { margin-top: 16px; color: #b3aca2; text-wrap: pretty; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; margin-top: 28px; padding: 0 24px;
    border-radius: 999px;
    background: #6fb2ff; color: #04121f;
    font-weight: 500; text-decoration: none;
  }
  a.btn:focus-visible { outline: 2px solid #ffb35c; outline-offset: 3px; }
  @media (prefers-color-scheme: light) {
    body { background: #faf7f2; color: #1c1814; }
    p { color: #554d44; }
    .mark { background: #1c1814; color: #faf7f2; }
    a.btn { background: #0a5fc4; color: #fff; }
  }
</style>

<div class="glow" aria-hidden="true"></div>
<main class="wrap">
  <div class="mark" aria-hidden="true">AA</div>
  <h1>You're offline</h1>
  <p>
    This page hasn't been saved to your device yet. Reconnect and it'll load
    normally — the rest of the site is already cached and should still work.
  </p>
  <a class="btn" href="./index.html">Back to the portfolio</a>
</main>
